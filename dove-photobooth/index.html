<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Dove Times Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Old+Standard+TT:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="booth" id="booth">
    <!-- ── The template: live camera inside the frame, then the final photo ── -->
    <div class="stage" id="stage">
      <div class="hole" id="hole">
        <video id="video" autoplay playsinline muted></video>
        <div class="cam-msg" id="camMsg" hidden></div>
      </div>
      <img class="frame" id="frameImg" alt="Newspaper frame">
      <img class="result" id="resultImg" alt="Your framed photo" hidden>
      <div class="countdown" id="countdown" hidden></div>
      <div class="flash" id="flash"></div>
    </div>

    <!-- Step: shooting -->
    <div class="controls" id="shootPanel">
      <button class="btn btn-main" id="captureBtn" type="button">Take photo</button>
    </div>

    <!-- Step: check the photo. Nothing is saved until OK -->
    <div class="controls controls-row" id="confirmPanel" hidden>
      <button class="btn btn-ghost btn-big" id="retakeBtn" type="button">Retake</button>
      <button class="btn btn-main" id="okBtn" type="button">OK</button>
    </div>
    <p class="save-error" id="saveError" role="alert" hidden>
      Couldn't save the photo. Check the connection and press OK again.
    </p>

    <!-- Step: saved — print + download code -->
    <div class="controls" id="resultPanel" hidden>
      <button class="btn btn-main btn-gold" id="printBtn" type="button">Print</button>
      <div class="code-box">
        <p class="code-label">Your photo code</p>
        <p class="code" id="photoCode"></p>
        <p class="code-help">
          Save this code: take a picture of it or write it down.
          To download your photo, go to <strong class="code-url" id="downloadUrl"></strong> and enter the code.
        </p>
      </div>
      <button class="btn btn-ghost" id="newPhotoBtn" type="button">Take another photo</button>
    </div>
  </main>

  <!-- Only this is visible when printing -->
  <div id="printSheet"><img id="printImg" alt=""></div>

  <canvas id="work" hidden></canvas>
  <script src="fullscreen.js"></script>
  <script src="app.js"></script>
</body>
</html>
